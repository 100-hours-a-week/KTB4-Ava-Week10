name: Frontend CD

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Docker Hub image name
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_REPOSITORY" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_REPOSITORY must be configured."
            exit 1
          fi
          echo "name=${DOCKERHUB_USERNAME,,}/${DOCKERHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      IMAGE: ${{ needs.publish.outputs.image }}:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Login to Docker Hub on EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${EC2_SSH_PORT:-22}"
          printf '%s' "$DOCKERHUB_READ_TOKEN" |
            ssh -p "$port" "$EC2_USER@$EC2_HOST" \
              "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy immutable image to EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${EC2_SSH_PORT:-22}"

          ssh -p "$port" "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          NAME=community-frontend
          ROLLBACK_NAME=community-frontend-rollback
          STAGING_NAME=community-frontend-staging
          STAGING_PORT=8081

          docker pull "$IMAGE"

          # Recover an interrupted rollback, or remove one left after a
          # previously successful deployment.
          if docker container inspect "$ROLLBACK_NAME" >/dev/null 2>&1; then
            if docker container inspect "$NAME" >/dev/null 2>&1; then
              docker stop --time 10 "$ROLLBACK_NAME" >/dev/null 2>&1 || true
              docker rm "$ROLLBACK_NAME"
            else
              docker rename "$ROLLBACK_NAME" "$NAME"
              docker start "$NAME"
            fi
          fi

          # Clean up any leftover staging container from a previous failed run.
          if docker container inspect "$STAGING_NAME" >/dev/null 2>&1; then
            docker stop --time 10 "$STAGING_NAME" >/dev/null 2>&1 || true
            docker rm "$STAGING_NAME"
          fi

          # Start the new image on a staging port while the current
          # container keeps serving traffic on :80
          docker run -d \
            --name "$STAGING_NAME" \
            --add-host host.docker.internal:host-gateway \
            -p "127.0.0.1:$STAGING_PORT:80" \
            -e BACKEND_HOST=host.docker.internal \
            -e BACKEND_PORT=8080 \
            "$IMAGE"

          healthy=false
          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:$STAGING_PORT/" > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "New image failed health check; keeping previous version running."
            docker logs "$STAGING_NAME"
            docker stop --time 10 "$STAGING_NAME" >/dev/null 2>&1 || true
            docker rm "$STAGING_NAME" 2>/dev/null || true
            exit 1
          fi

          docker stop --time 10 "$STAGING_NAME"
          docker rm "$STAGING_NAME"

          had_previous=false
          if docker container inspect "$NAME" >/dev/null 2>&1; then
            had_previous=true
            docker stop --time 10 "$NAME"
            if ! docker rename "$NAME" "$ROLLBACK_NAME"; then
              echo "Failed to prepare rollback container; restarting the previous version."
              docker start "$NAME"
              exit 1
            fi
          fi

          started=false
          if docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              --add-host host.docker.internal:host-gateway \
              -p 80:80 \
              -e BACKEND_HOST=host.docker.internal \
              -e BACKEND_PORT=8080 \
              "$IMAGE"; then
            started=true
          fi

          healthy=false
          if [ "$started" = true ]; then
            for attempt in {1..10}; do
              if curl --fail --silent --show-error \
                http://127.0.0.1/ > /dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
          fi

          if [ "$healthy" = true ]; then
            if [ "$had_previous" = true ]; then
              docker rm "$ROLLBACK_NAME" || true
            fi
            docker image prune -f || true
            exit 0
          fi

          echo "New image failed health check."
          docker logs "$NAME" 2>/dev/null || true
          docker stop --time 10 "$NAME" >/dev/null 2>&1 || true
          docker rm "$NAME" >/dev/null 2>&1 || true

          if [ "$had_previous" = true ]; then
            echo "Restoring previous frontend container."
            docker rename "$ROLLBACK_NAME" "$NAME"
            docker start "$NAME"

            restored=false
            for attempt in {1..10}; do
              if curl --fail --silent --show-error \
                http://127.0.0.1/ > /dev/null; then
                restored=true
                break
              fi
              sleep 2
            done

            if [ "$restored" = true ]; then
              echo "Previous frontend version restored successfully."
            else
              echo "Previous frontend version also failed to start."
              docker logs "$NAME" 2>/dev/null || true
            fi
          fi

          exit 1
          REMOTE
